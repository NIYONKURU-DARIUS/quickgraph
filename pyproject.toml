[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickgraph-darius12"
version = "0.1.0"
description = "A simple package to draw line, bar, pie and scatter graphs"
readme = "README.md"
authors = [
    { name = "Darius", email = "dariusniyonkuru351@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/NIYONKURU-DARIUS/quickgraph/quickgraph"